<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | Java Link</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
<header class="login-site-header">
    <a class="home-logo" href="/" aria-label="Java Linkトップ">
        <img class="home-logo-image" src="/images/JavaLink_icon.png" alt="">
        <span>Java Link</span>
    </a>
</header>

<main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
        <p class="login-label">WELCOME BACK</p>
        <h1 id="login-title">ログイン</h1>
        <p class="login-description">Java Linkの学習を続けましょう。</p>

        <form class="login-form">
            <label for="email">メールアドレス</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="password">パスワード</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="button">ログイン</button>
        </form>

        <p class="login-register-guide">
            はじめての方は<a href="/register">アカウントを作成</a>
        </p>
    </section>
</main>
</body>
</html>
