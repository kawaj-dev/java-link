<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習の目次 | Java Link</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='code-reading-index-1')}"
          href="/css/style.css?v=code-reading-index-1">
</head>
<body class="code-reading-index-body">
<main class="code-reading-index-page">
    <nav class="code-reading-index-navigation" aria-label="ページ案内">
        <a th:href="@{/}" href="/">← Java Linkトップへ</a>
    </nav>

    <header class="code-reading-index-header">
        <p class="code-reading-index-label">CODE READING LESSON</p>
        <h1>コードを左から読む</h1>
        <p>学習の目次</p>
    </header>

    <section class="code-reading-stage-grid" aria-label="Stage一覧">
        <article class="code-reading-stage-card" th:each="stage : ${stages}">
            <p class="code-reading-stage-number" th:text="${stage.stageName}">Stage 1</p>
            <h2 th:text="${stage.title}">「Hello」と表示するプログラムを読めるようになろう</h2>
            <p class="code-reading-stage-description" th:text="${stage.description}">
                Javaの基本のコードを学びます。
            </p>
            <a class="code-reading-stage-link"
               th:href="@{/quiz(lessonId=${stage.lessonId})}"
               href="/quiz?lessonId=hello-program-reading">
                <span th:text="|${stage.stageName}へ進む|">Stage 1へ進む</span>
                <span aria-hidden="true">→</span>
            </a>
        </article>
    </section>
</main>
</body>
</html>
